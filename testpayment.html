<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flutterwave V4 Payment</title>
<!-- Corrected CDN links for Tailwind CSS and Inter font -->
<script src="https://www.google.com/search?q=https://cdn.tailwindcss.com"></script>
<style>
@import url('https://www.google.com/search?q=https://fonts.googleapis.com/css2%3Ffamily%3DInter:wght%40400%3B500%3B700%26display%3Dswap');
body {
font-family: 'Inter', sans-serif;
background-color: #f0f4f8;
display: flex;
justify-content: center;
align-items: center;
min-height: 100vh;
}
</style>
</head>
<body class="p-4">
<div class="bg-white shadow-xl rounded-2xl p-8 max-w-xl w-full">
<h1 class="text-3xl font-bold text-center text-gray-800 mb-6">Make a Payment</h1>
<form id="paymentForm" class="space-y-6">
<div>
<label for="amount" class="block text-sm font-medium text-gray-700">Amount (NGN)</label>
<input type="number" id="amount" name="amount" value="1000" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-3" required>
</div>
<div>
<label for="email" class="block text-sm font-medium text-gray-700">Email</label>
<input type="email" id="email" name="email" value="testuser@example.com" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-3" required>
</div>
<div class="grid grid-cols-2 gap-4">
<div>
<label for="card_number" class="block text-sm font-medium text-gray-700">Card Number</label>
<input type="text" id="card_number" name="card_number" value="5531886652142950" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-3" required>
</div>
<div>
<label for="cvv" class="block text-sm font-medium text-gray-700">CVV</label>
<input type="text" id="cvv" name="cvv" value="564" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-3" required>
</div>
<div>
<label for="expiry_month" class="block text-sm font-medium text-gray-700">Expiry Month</label>
<input type="text" id="expiry_month" name="expiry_month" value="09" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-3" required>
</div>
<div>
<label for="expiry_year" class="block text-sm font-medium text-gray-700">Expiry Year</label>
<input type="text" id="expiry_year" name="expiry_year" value="32" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-3" required>
</div>
</div>
<button type="submit" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors">
Pay Now
</button>
</form>

    <div id="status-message" class="mt-6 p-4 rounded-md text-sm font-medium hidden"></div>
    <pre id="response-data" class="mt-4 p-4 bg-gray-100 rounded-md overflow-x-auto text-xs text-gray-900 break-all hidden"></pre>
</div>

<!-- 
    Flutterwave's V3 library provides the Ravepay.encrypt() function, which is the required method 
    for client-side card data encryption before sending the data to the V4 backend API.
-->
<script src="https://checkout.flutterwave.com/v3.js"></script>

<script>
    const PUBLIC_KEY = "FLWPUBK_TEST-XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX-X"; // Use your V4 public key here.

    document.getElementById('paymentForm').addEventListener('submit', async function(event) {
        event.preventDefault();

        const form = event.target;
        const amount = form.amount.value;
        const email = form.email.value;
        const cardNumber = form.card_number.value;
        const cvv = form.cvv.value;
        const expiryMonth = form.expiry_month.value;
        const expiryYear = form.expiry_year.value;

        const statusMessage = document.getElementById('status-message');
        const responseData = document.getElementById('response-data');
        statusMessage.classList.remove('hidden', 'bg-red-100', 'text-red-800', 'bg-green-100', 'text-green-800');
        statusMessage.classList.add('bg-gray-100', 'text-gray-800');
        statusMessage.textContent = "Processing payment...";
        statusMessage.classList.remove('hidden');
        responseData.classList.add('hidden');

        try {
            if (typeof Ravepay === 'undefined') {
                throw new Error("Ravepay library not loaded. Check the script tag for v3.js.");
            }
            
            // Encrypt sensitive card details
            const cardDetails = {
                card_number: cardNumber,
                cvv: cvv,
                expiry_month: expiryMonth,
                expiry_year: expiryYear,
            };
            
            const encryptedCardDetails = Ravepay.encrypt(PUBLIC_KEY, cardDetails);

            const payload = {
                amount: amount,
                email: email,
                card_details: encryptedCardDetails, // Send the encrypted object to your backend
            };

            const response = await fetch('/initiate-payment/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': '{{ csrf_token }}', // Django's CSRF token for security
                },
                body: JSON.stringify(payload)
            });

            const result = await response.json();

            if (response.ok) {
                statusMessage.classList.remove('bg-gray-100', 'text-gray-800');
                statusMessage.classList.add('bg-green-100', 'text-green-800');
                statusMessage.textContent = `Payment initiated successfully! Status: ${result.data.status}`;
                responseData.textContent = JSON.stringify(result, null, 2);
                responseData.classList.remove('hidden');
            } else {
                statusMessage.classList.remove('bg-gray-100', 'text-gray-800');
                statusMessage.classList.add('bg-red-100', 'text-red-800');
                statusMessage.textContent = `Payment failed: ${result.message || 'An error occurred'}`;
                responseData.textContent = JSON.stringify(result, null, 2);
                responseData.classList.remove('hidden');
            }
        } catch (error) {
            console.error("Error during payment:", error);
            statusMessage.classList.remove('bg-gray-100', 'text-gray-800');
            statusMessage.classList.add('bg-red-100', 'text-red-800');
            statusMessage.textContent = `An unexpected error occurred: ${error.message}`;
        }
    });
</script>

</body>
</html>
